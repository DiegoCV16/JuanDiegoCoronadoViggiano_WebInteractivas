<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieReviews - Películas Destacadas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-md mr-navbar py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-collection-play-fill"></i>
        Movie<span class="mr-brand-highlight">Reviews</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mrNavContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mrNavContent">
        <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-md-4">
          <li class="nav-item">
            <a class="nav-link active" href="index.html"><i class="bi bi-house-fill me-1"></i>Inicio</a>
          </li>
          <li class="nav-item">
            <button class="nav-link btn btn-link border-0" data-bs-toggle="modal" data-bs-target="#mr-fav-modal" id="mr-fav-open-btn">
              <i class="bi bi-heart me-1"></i>Favoritos
              <span class="badge rounded-pill bg-danger mr-fav-count">0</span>
            </button>
          </li>
        </ul>
        <form class="d-flex" role="search" onsubmit="return false;">
          <input class="form-control form-control-sm" type="search" placeholder="Buscar película..." id="mr-search">
        </form>
      </div>
    </div>
  </nav>

  <!-- ===================== HERO / TÍTULO ===================== -->
  <div class="container text-center pt-5 pb-3">
    <h1 class="mr-hero-title"><i class="bi bi-film me-2"></i>Películas <span class="mr-highlight">Destacadas</span></h1>
    <p class="mr-hero-subtitle">Las mejores películas según la crítica y el público</p>

    <div class="d-flex flex-wrap justify-content-center gap-2 mt-3" id="mr-filters">
      <button class="mr-filter-btn active" data-decade="Todos">Todos</button>
      <button class="mr-filter-btn" data-decade="1990-1999">1990-1999</button>
      <button class="mr-filter-btn" data-decade="2000-2009">2000-2009</button>
      <button class="mr-filter-btn" data-decade="2010-2019">2010-2019</button>
      <button class="mr-filter-btn" data-decade="2020-2026">2020-2026</button>
    </div>
  </div>

  <!-- ===================== ESTADOS: carga / error ===================== -->
  <div class="container">
    <div class="mr-state-box" id="mr-loading">
      <div class="spinner-border mr-brand-highlight" role="status" style="color:#2f6feb;"></div>
      <p class="mt-3 mb-0">Cargando películas...</p>
    </div>

    <div class="mr-state-box d-none" id="mr-error">
      <i class="bi bi-exclamation-triangle text-danger" style="font-size:2rem;"></i>
      <p class="mt-2 mb-3">No se pudieron cargar las películas. Intenta de nuevo.</p>
      <button class="btn mr-btn-primary text-white" id="mr-retry-btn">
        <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
      </button>
    </div>

    <div class="mr-state-box d-none" id="mr-empty">
      <i class="bi bi-search" style="font-size:2rem;"></i>
      <p class="mt-2 mb-0">No se encontraron películas con ese criterio.</p>
    </div>
  </div>

  <!-- ===================== GRID DE PELÍCULAS ===================== -->
  <div class="container pb-5">
    <div class="row g-4" id="mr-movies-grid"></div>
  </div>

  <!-- ===================== MODAL DE FAVORITOS ===================== -->
  <div class="modal fade" id="mr-fav-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-heart-fill text-danger me-2"></i>Mis Favoritos
            <span class="badge rounded-pill bg-danger" id="mr-fav-modal-count">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="mr-fav-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger" id="mr-fav-clear-all">
            <i class="bi bi-trash me-1"></i>Eliminar todos
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
