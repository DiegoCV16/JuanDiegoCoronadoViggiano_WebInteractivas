<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieReviews - Reseña</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-md mr-navbar py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-collection-play-fill"></i>
        Movie<span class="mr-brand-highlight">Reviews</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mrNavContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mrNavContent">
        <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-md-4">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-fill me-1"></i>Inicio</a>
          </li>
          <li class="nav-item">
            <button class="nav-link btn btn-link border-0" data-bs-toggle="modal" data-bs-target="#mr-fav-modal" id="mr-fav-open-btn">
              <i class="bi bi-heart me-1"></i>Favoritos
              <span class="badge rounded-pill bg-danger mr-fav-count">0</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===================== ESTADOS: carga / error ===================== -->
  <div class="container">
    <div class="mr-state-box" id="mr-loading">
      <div class="spinner-border" role="status" style="color:#2f6feb;"></div>
      <p class="mt-3 mb-0">Cargando información de la película...</p>
    </div>

    <div class="mr-state-box d-none" id="mr-error">
      <i class="bi bi-exclamation-triangle text-danger" style="font-size:2rem;"></i>
      <p class="mt-2 mb-3" id="mr-error-msg">No se encontró la película solicitada.</p>
      <a href="index.html" class="btn mr-btn-primary text-white"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
    </div>
  </div>

  <!-- ===================== DETALLE ===================== -->
  <div class="container py-4 d-none" id="mr-detail-wrap">
    <div class="row g-4">
      <!-- Póster -->
      <div class="col-12 col-md-4">
        <img id="mr-d-poster" src="" alt="" class="mr-detail-poster">
      </div>

      <!-- Información principal -->
      <div class="col-12 col-md-8">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <h2 id="mr-d-title" class="mb-0"></h2>
          <button class="btn btn-outline-danger" id="mr-d-fav-btn">
            <i class="bi bi-heart me-1"></i><span id="mr-d-fav-label">Favorito</span>
          </button>
        </div>

        <div class="d-flex flex-wrap gap-3 text-muted mt-2 mb-3">
          <span><i class="bi bi-calendar3 me-1"></i><span id="mr-d-year"></span></span>
          <span><i class="bi bi-clock me-1"></i><span id="mr-d-runtime"></span> minutos</span>
          <span><i class="bi bi-file-earmark-text me-1"></i><span id="mr-d-content-rating"></span></span>
        </div>

        <div class="mb-3" id="mr-d-genres"></div>

        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="fs-4 fw-bold" id="mr-d-rating"></span>
          <span class="mr-stars fs-6" id="mr-d-stars"></span>
          <span class="text-muted small" id="mr-d-votes"></span>
        </div>

        <div class="mb-3" id="mr-d-metascore-wrap">
          <div class="d-flex justify-content-between small mb-1">
            <span class="mr-info-label mb-0">Metascore</span>
            <span id="mr-d-metascore-value" class="fw-semibold"></span>
          </div>
          <div class="mr-metascore-track">
            <div class="mr-metascore-fill" id="mr-d-metascore-fill"></div>
          </div>
        </div>

        <p id="mr-d-description" class="mb-4"></p>

        <div class="mb-3">
          <div class="mr-info-label">Intereses</div>
          <div id="mr-d-interests"></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6 col-md-3">
            <div class="mr-info-label">Idiomas</div>
            <div class="mr-info-value" id="mr-d-languages"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="mr-info-label">Países</div>
            <div class="mr-info-value" id="mr-d-countries"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="mr-info-label">Presupuesto</div>
            <div class="mr-info-value" id="mr-d-budget"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="mr-info-label">Recaudación</div>
            <div class="mr-info-value" id="mr-d-gross"></div>
          </div>
        </div>

        <div class="mb-3">
          <div class="mr-info-label">Productoras</div>
          <div class="mr-info-value" id="mr-d-companies"></div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <a href="#" target="_blank" class="btn btn-danger" id="mr-d-trailer-btn">
            <i class="bi bi-play-fill me-1"></i>Ver tráiler
          </a>
          <a href="index.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Volver
          </a>
        </div>

        <div class="mt-3" id="mr-d-links-wrap">
          <div class="mr-info-label mb-1">Enlaces externos</div>
          <div id="mr-d-links"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL DE FAVORITOS ===================== -->
  <div class="modal fade" id="mr-fav-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-heart-fill text-danger me-2"></i>Mis Favoritos
            <span class="badge rounded-pill bg-danger" id="mr-fav-modal-count">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="mr-fav-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger" id="mr-fav-clear-all">
            <i class="bi bi-trash me-1"></i>Eliminar todos
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/resena.js"></script>
</body>
</html>
