<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Perfil | Diego Coronado</title>

    <!-- Bootstrap para conservar el objetivo del ejercicio original -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #111111;
        }

        .perfil-card {
            max-width: 460px;
            width: 92%;
            background: #1b1b1b;
            border: 1px solid #444;
        }

        .avatar {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border: 4px solid #777;
        }

        .nombre {
            color: #f1f1f1;
        }

        .subtitulo {
            color: #a8a8a8;
        }

        .badge-tech {
            background: #2c2c2c !important;
            color: #e5e5e5;
            border: 1px solid #555;
            font-weight: 500;
        }

        .btn-contacto {
            color: #fff;
            border-color: #777;
        }

        .btn-contacto:hover {
            background: #eee;
            color: #111;
            border-color: #eee;
        }
    </style>
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="perfil-card rounded-4 shadow-lg p-4 text-center">
        <div class="d-flex justify-content-center mb-4">
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
                alt="Foto de perfil de Diego Coronado"
                class="avatar rounded-circle shadow"
            >
        </div>

        <h1 class="nombre fw-bold fs-3 mb-1">Diego Coronado</h1>
        <p class="subtitulo fs-6 mb-4">Desarrollador Web &amp; Entusiasta de la Tecnología</p>

        <div class="d-flex justify-content-center flex-wrap gap-2 mb-4">
            <span class="badge rounded-pill badge-tech px-3 py-2">HTML</span>
            <span class="badge rounded-pill badge-tech px-3 py-2">CSS</span>
            <span class="badge rounded-pill badge-tech px-3 py-2">JavaScript</span>
            <span class="badge rounded-pill badge-tech px-3 py-2">Bootstrap</span>
            <span class="badge rounded-pill badge-tech px-3 py-2">React</span>
        </div>

        <a href="#" class="btn btn-outline-light btn-contacto w-100 py-2 d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-envelope"></i>
            Contactar
        </a>
    </div>
</body>
</html>
